<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>翻頁時鐘</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--fg:#f4f4f4;--card:#141414;--dim:1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--fg);overflow:hidden;
  font-family:Roboto,"Helvetica Neue",Arial,"Noto Sans TC",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%}

#stage{height:100%;display:flex;flex-direction:column;gap:max(6px,1.6vmin);
  padding:max(8px,2.2vmin);
  padding-top:calc(max(8px,2.2vmin) + env(safe-area-inset-top,0px));
  padding-bottom:calc(max(8px,2.2vmin) + env(safe-area-inset-bottom,0px));
  padding-left:calc(max(8px,2.2vmin) + env(safe-area-inset-left,0px));
  padding-right:calc(max(8px,2.2vmin) + env(safe-area-inset-right,0px));
  filter:brightness(var(--dim))}
@media (orientation:landscape){#stage{flex-direction:row}}

.card{flex:1;min-width:0;min-height:0;position:relative;container-type:size;perspective:1400px}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.half.top{top:0;border-radius:3cqmin 3cqmin 0 0;z-index:1}
.half.bottom{bottom:0;border-radius:0 0 3cqmin 3cqmin;z-index:1}
.half span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;
  font-size:min(86cqh,66cqw);font-weight:700;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--fg)}
.half.top span{top:0}
.half.bottom span{bottom:0}

.flip{visibility:hidden}
.go .flip{visibility:visible}
.flip.top{transform-origin:50% 100%;z-index:3}
.flip.bottom{transform-origin:50% 0;transform:rotateX(90deg);z-index:2}
.go .flip.top{animation:ft .3s ease-in forwards}
.go .flip.bottom{animation:fb .3s ease-out .3s forwards}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{to{transform:rotateX(0)}}

.hinge{position:absolute;left:0;right:0;top:50%;height:max(2px,.7cqh);transform:translateY(-50%);background:#000;z-index:6}
.lab{position:absolute;z-index:7;font-size:max(12px,4.2cqmin);font-weight:500;letter-spacing:.02em;opacity:.8;color:var(--fg)}
.tl{top:3.5cqh;left:4cqw}.bl{bottom:3.5cqh;left:4cqw}.br{bottom:3.5cqh;right:4cqw}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(28,28,28,.96);border-top:1px solid #333;font-size:15px;color:#eee}
#panel.open{display:block}
#panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#panel button{font:inherit;color:#eee;background:#2c2c2c;border:1px solid #444;border-radius:10px;padding:10px 14px;min-height:44px}
#panel button:focus-visible,#panel input:focus-visible{outline:2px solid #62c8ff;outline-offset:2px}
#panel i{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:var(--fg);margin-right:.4em;vertical-align:-.1em}
#panel input[type=range]{flex:1;min-width:140px;accent-color:#bbb}
#wl{font-size:13px;opacity:.75}
</style>
</head>
<body>
<main id="stage" aria-label="翻頁時鐘">
  <section class="card" id="hc" aria-hidden="true">
    <div class="half top"><span></span></div>
    <div class="half bottom"><span></span></div>
    <div class="half top flip"><span></span></div>
    <div class="half bottom flip"><span></span></div>
    <div class="hinge"></div>
    <div class="lab tl" id="date"></div>
    <div class="lab bl" id="ampm"></div>
  </section>
  <section class="card" id="mc" aria-hidden="true">
    <div class="half top"><span></span></div>
    <div class="half bottom"><span></span></div>
    <div class="half top flip"><span></span></div>
    <div class="half bottom flip"><span></span></div>
    <div class="hinge"></div>
    <div class="lab tl" id="wd"></div>
    <div class="lab br" id="sec"></div>
  </section>
</main>

<div id="panel">
  <div class="row">
    <button id="b24"></button>
    <button id="bsec"></button>
    <button id="bcol"><i></i>顏色</button>
  </div>
  <label class="row">亮度
    <input id="dim" type="range" min="15" max="100" step="5">
  </label>
  <p id="wl"></p>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const COLORS = ['#f4f4f4', '#4dff9a', '#ffb340', '#ff6b5c', '#62c8ff'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function load() { try { return JSON.parse(localStorage.getItem('flipclock') || '{}'); } catch (e) { return {}; } }
  function save() { try { localStorage.setItem('flipclock', JSON.stringify(S)); } catch (e) {} }
  const S = Object.assign({ h24: false, sec: true, color: 0, dim: 100 }, load());

  function Card(el) {
    const topS = el.querySelector('.top:not(.flip) span');
    const botS = el.querySelector('.bottom:not(.flip) span');
    const fTop = el.querySelector('.top.flip span');
    const fBot = el.querySelector('.bottom.flip span');
    let cur = null, timer = null;
    function finish() {
      if (timer) { clearTimeout(timer); timer = null; }
      el.classList.remove('go');
      botS.textContent = cur;
    }
    return {
      set(v) {
        if (v === cur) return;
        if (cur === null || reduce) { cur = v; topS.textContent = botS.textContent = v; return; }
        if (timer) finish();
        fTop.textContent = cur;
        fBot.textContent = v;
        topS.textContent = v;
        cur = v;
        void el.offsetWidth;
        el.classList.add('go');
        timer = setTimeout(finish, 640);
      }
    };
  }

  const hc = Card($('#hc')), mc = Card($('#mc'));
  const p2 = n => String(n).padStart(2, '0');

  function render() {
    const d = new Date(), h = d.getHours();
    hc.set(S.h24 ? p2(h) : String(h % 12 || 12));
    mc.set(p2(d.getMinutes()));
    $('#ampm').textContent = S.h24 ? '' : (h >= 12 ? '下午' : '上午');
    $('#date').textContent = d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
    $('#wd').textContent = d.toLocaleDateString('zh-TW', { weekday: 'long' });
    $('#sec').textContent = S.sec ? p2(d.getSeconds()) : '';
  }
  function loop() { render(); setTimeout(loop, 1000 - (Date.now() % 1000) + 5); }

  function applySettings() {
    const r = document.documentElement.style;
    r.setProperty('--fg', COLORS[S.color]);
    r.setProperty('--dim', S.dim / 100);
    $('#b24').textContent = S.h24 ? '24 小時制' : '12 小時制';
    $('#bsec').textContent = S.sec ? '秒數：顯示' : '秒數：隱藏';
    $('#dim').value = S.dim;
    save();
    render();
  }
  $('#b24').onclick = () => { S.h24 = !S.h24; applySettings(); };
  $('#bsec').onclick = () => { S.sec = !S.sec; applySettings(); };
  $('#bcol').onclick = () => { S.color = (S.color + 1) % COLORS.length; applySettings(); };
  $('#dim').oninput = e => { S.dim = +e.target.value; applySettings(); };

  // Tap the clock to open / close the settings panel
  const panel = $('#panel');
  let hideTimer = null;
  function arm() { clearTimeout(hideTimer); hideTimer = setTimeout(() => panel.classList.remove('open'), 6000); }
  panel.addEventListener('click', e => { e.stopPropagation(); arm(); });
  panel.addEventListener('input', arm);
  $('#stage').addEventListener('click', () => {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) arm();
    if (!lock) wake();
  });

  // Keep the screen on
  let lock = null;
  function wlText() {
    $('#wl').textContent = !('wakeLock' in navigator) ? '此瀏覽器不支援螢幕常亮'
      : lock ? '螢幕常亮：已開啟' : '螢幕常亮：尚未生效，點一下畫面重試';
  }
  async function wake() {
    if (!('wakeLock' in navigator)) { wlText(); return; }
    try {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; wlText(); });
    } catch (e) { lock = null; }
    wlText();
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

  applySettings();
  loop();
  wake();

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
